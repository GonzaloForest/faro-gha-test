name: siomaa-scrape-test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright pandas lxml html5lib beautifulsoup4
      - run: playwright install --with-deps chromium
      - name: Test scraping SIOMAA
        env:
          SIOMAA_USER: ${{ secrets.SIOMAA_USER }}
          SIOMAA_PASSWORD: ${{ secrets.SIOMAA_PASSWORD }}
          SIOMAA_SESSION_JSON: ${{ secrets.SIOMAA_SESSION_JSON }}
        run: |
          printf '%s' "$SIOMAA_SESSION_JSON" > siomaa_session.json
          python test_siomaa.py
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia
          path: out/
          if-no-files-found: ignore
